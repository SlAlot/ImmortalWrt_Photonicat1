name: Build SWRT Photonicat1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.config', 'feeds.conf.default', 'sources.lock.json', 'diy.sh', 'files/**', 'package/**', 'scripts/**', 'tests/**', '.github/workflows/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: swrt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts and integration invariants
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          bash -n scripts/prepare.sh diy.sh
          shellcheck scripts/prepare.sh diy.sh
          shellcheck -s sh -e SC1091 files/etc/uci-defaults/99-swrt files/etc/hotplug.d/iface/95-swrt-qmodem-mwan
          sh -n files/usr/libexec/swrt-apk-status
          shellcheck -s sh files/usr/libexec/swrt-apk-status
          sh -n files/usr/share/qmodem/swrt-scan-once
          shellcheck -s sh files/usr/share/qmodem/swrt-scan-once
          python3 -m unittest discover -s tests -v
          git diff --check
  build:
    # Packaging-only maintenance can skip compilation while retaining checks.
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip firmware]'))
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build disk and dependencies
        run: |
          # Only remove preinstalled toolchains on this disposable GitHub runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget curl ccache cmake ninja-build \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libmpc-dev libmpfr-dev \
            libreadline-dev libtool autoconf automake autopoint pkgconf subversion \
            device-tree-compiler xsltproc libxml-parser-perl patch tar xz-utils zstd
          df -h
      - name: Read pinned source revision
        id: source
        run: |
          echo "sha=$(python3 -c 'import json; print(json.load(open("sources.lock.json"))["source"]["commit"])')" >> "$GITHUB_OUTPUT"
      - name: Check out ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: ${{ steps.source.outputs.sha }}
          path: openwrt
      - name: Restore downloaded source cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: swrt-downloads-${{ runner.os }}-${{ hashFiles('sources.lock.json', '.config') }}
          restore-keys: swrt-downloads-${{ runner.os }}-
      - name: Install feeds and resolve configuration
        run: |
          set -euo pipefail
          bash scripts/prepare.sh "$GITHUB_WORKSPACE/openwrt" 2>&1 | tee prepare.log
          test -s openwrt/swrt-metadata/config.resolved
      - name: Download all sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          make download -j8 V=s 2>&1 | tee ../download.log
          python3 ../scripts/check-config.py .config
      - name: Compile firmware
        working-directory: openwrt
        run: |
          set -euo pipefail
          python3 ../scripts/check-config.py .config
          if ! make -j"$(nproc)" V=s 2>&1 | tee ../build.log; then
            echo "::warning::Parallel build failed; retrying serially with the existing build tree"
            make -j1 V=s 2>&1 | tee ../build-retry.log
          fi
          python3 ../scripts/check-config.py .config
      - name: Verify and collect firmware
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > release-history.json
          version=$(python3 scripts/release-version.py release-history.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 scripts/collect-firmware.py openwrt firmware-release "$version"
      - name: Save firmware
        uses: actions/upload-artifact@v4
        with:
          name: SWRT-Photonicat1-v${{ steps.release.outputs.version }}
          path: firmware-release/
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified firmware
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          FIRMWARE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          tag="v$FIRMWARE_VERSION"
          gh release create "$tag" firmware-release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SWRT 光影猫一代 $tag" --notes-file docs/RELEASE-NOTES.md
      - name: Save build logs and resolved configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SWRT-build-diagnostics-${{ github.run_number }}
          path: |
            *.log
            openwrt/swrt-metadata/
            openwrt/.config
            openwrt/logs/
            release-history.json
          include-hidden-files: true
          retention-days: 7
